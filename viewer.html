<head>

 crossorigin="anonymous"></script>

<title>PDF Viewer | Krish Soni</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
 <div class="menu-btn" onclick="toggleMenu()">☰</div>
<!-- SIDEBAR -->
<div class="sidebar">
  <h2>📚 Notes</h2>
  <a href="index.html">🏠 Home</a>
  <a href="about.html">👤 About</a>
  <a href="contact.html">📩 Contact</a>
  <a href="privacy-policy.html">🔒 Privacy</a>
  <a href="terms.html">📄 Terms</a>
</div>

<!-- MAIN -->
<div class="main">

<header>
  <h1>📄 PDF Viewer</h1>
  <p style="color:#94a3b8; margin-top:5px;">Read your notes below</p>
</header>

<div class="container">

  <!-- TOP BAR -->
  <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
    <span id="fileName">Loading...</span>
    <a id="downloadBtn" href="#" target="_blank" rel="noopener noreferrer" style="
      background:#8b5cf6;
      padding:6px 12px;
      border-radius:8px;
      color:white;
      text-decoration:none;
      font-size:14px;
    ">Download</a>
  </div>

  <!-- PDF FRAME -->
  <div class="card" style="padding:0;">
  </div>

  <iframe id="pdfFrame"></iframe>

</div>
</div>

<!-- SCRIPT -->
<script src="subject.js"></script>
<script>
const viewerParams = new URLSearchParams(window.location.search);
const file = viewerParams.get("file");

const frame = document.getElementById("pdfFrame");
const fileName = document.getElementById("fileName");
const downloadBtn = document.getElementById("downloadBtn");
const studyFileResolver = window.resolveStudyFileUrl;
const allowedPdfPaths = new Set(
    Object.values(window.subjectCatalog || {}).flatMap(subject =>
        subject.pdfs
            .map(pdf => studyFileResolver?.(pdf.link))
            .filter(url => url && /\.pdf$/i.test(url.pathname))
            .map(url => url.pathname)
    )
);
const pdfUrl = file && typeof studyFileResolver === "function"
    ? studyFileResolver(file)
    : null;

if (
    pdfUrl &&
    /\.pdf$/i.test(pdfUrl.pathname) &&
    allowedPdfPaths.has(pdfUrl.pathname)
) {
    let pdfFileName = pdfUrl.pathname.split("/").pop();
    try {
        pdfFileName = decodeURIComponent(pdfFileName);
    } catch {
        // Keep the encoded filename when it is not valid percent-encoding.
    }

    frame.src = pdfUrl.href + "#zoom=page-width";
    fileName.textContent = pdfFileName;
    downloadBtn.href = pdfUrl.href;

    downloadBtn.addEventListener("click", function(e) {
        e.preventDefault();

        const link = document.createElement("a");
        link.href = pdfUrl.href;
        link.download = pdfFileName;

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
} else {
    if (!file) {
        fileName.textContent = "No PDF Found";
    } else {
        fileName.textContent = "Invalid or unsupported PDF link";
    }
    frame.style.display = "none";
    downloadBtn.style.display = "none";
}

 function toggleMenu() {
  document.querySelector(".sidebar").classList.toggle("active");
}

</script>
</body>
</html>
